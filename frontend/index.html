<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Expense Tracker</span>
    </div>
  </nav>

  <div class="container pb-5">

    <div id="alertBox"></div>

    <div class="summary-grid mb-4">
      <div class="card">
        <div class="card-body">
          <h6 class="card-title">Total</h6>
          <p id="totalAmount" class="fs-4 mb-0">$0.00</p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <h6 class="card-title">Count</h6>
          <p id="totalCount" class="fs-4 mb-0">0</p>
        </div>
      </div>
      <div class="card">
        <div class="card-body">
          <h6 class="card-title">Highest</h6>
          <p id="highestExpense" class="fs-4 mb-0">$0.00</p>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Add an expense</h5>
        <form id="addForm" novalidate>
          <div class="row g-2">
            <div class="col-12 col-md-3">
              <input type="text" id="title" class="form-control" placeholder="Title" maxlength="100">
            </div>
            <div class="col-6 col-md-2">
              <input type="number" id="amount" class="form-control" placeholder="Amount" step="0.01">
            </div>
            <div class="col-6 col-md-3">
              <select id="category" class="form-select">
                <option value="">Choose category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-12 col-md-2">
              <input type="date" id="date" class="form-control">
            </div>
            <div class="col-12 col-md-2">
              <button type="submit" class="btn btn-success w-100">Add</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="d-flex align-items-center gap-2 mb-3">
      <label for="filterCategory" class="form-label mb-0">Category</label>
      <select id="filterCategory" class="form-select w-auto">
        <option value="All">All</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Bills">Bills</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div id="spinner" class="text-center my-4">
      <div class="spinner-border text-primary"></div>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead>
          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expensesTableBody"></tbody>
      </table>
    </div>

  </div>

  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editForm" novalidate>
          <div class="modal-header">
            <h5 class="modal-title">Edit expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editId">
            <div id="editAlert"></div>
            <input type="text" id="editTitle" class="form-control mb-2" placeholder="Title" maxlength="100">
            <input type="number" id="editAmount" class="form-control mb-2" placeholder="Amount" step="0.01">
            <select id="editCategory" class="form-select mb-2">
              <option value="">Choose category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
            <input type="date" id="editDate" class="form-control">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
